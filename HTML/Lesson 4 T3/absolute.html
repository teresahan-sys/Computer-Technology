<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width: 70%;
            padding: 25px;
            position: relative;
            border: 2px solid #fcd2d2;
        }

        #badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgb(253, 185, 199);
            padding: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span id="badge">SALE</span>
        <h2>Product</h2>
        <p>Product Description</p>
    </div>
</body>
</html>
